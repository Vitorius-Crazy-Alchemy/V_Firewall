<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Vibrant Red Background Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Top Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Left Facet: Vibrant Sky Blue Gradient -->
    <linearGradient id="vLeftSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Right Facet: Rich Azure Sky Blue Gradient -->
    <linearGradient id="vRightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="vShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base Red Squircle with Shadow -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#redGrad)" filter="url(#baseShadow)"/>
  <!-- Top Bevel / Outer Rim -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Subtle Cyber Shield Linework in Background -->
  <path d="M 64,22 C 78,28 92,28 92,28 C 92,62 78,84 64,94 C 50,84 36,62 36,28 C 36,28 50,28 64,22 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Letter V with 3D Bevel Facets in Sky Blue -->
  <g filter="url(#vShadow)">
    <!-- Left Facet of V -->
    <path d="M 24,28 L 46,28 L 64,68 L 64,98 Z" fill="url(#vLeftSky)"/>
    <!-- Right Facet of V -->
    <path d="M 104,28 L 82,28 L 64,68 L 64,98 Z" fill="url(#vRightSky)"/>
    <!-- Top Crisp Highlights on V -->
    <line x1="24" y1="28" x2="46" y2="28" stroke="#f0f9ff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="82" y1="28" x2="104" y2="28" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Center Spine Highlight -->
    <line x1="64" y1="68" x2="64" y2="98" stroke="#e0f2fe" stroke-width="1" opacity="0.8"/>
  </g>
</svg>
